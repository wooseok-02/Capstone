<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코코 펫</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="pet-surface" aria-label="코코 데스크톱 펫">
    <div id="pet-tip" class="tip" role="status" aria-live="polite">저를 눌러주세요!</div>
    <button id="pet" type="button" aria-label="코코 고양이 클릭하여 로그인 또는 회원가입 열기" title="클릭: 코코 열기 · 드래그: 이동 · 오른쪽 클릭: 메뉴">
      <img src="../assets/koko-pet.png" alt="접힌 귀와 세이지색 눈을 가진 코코 고양이" draggable="false">
    </button>
  </main>
  <script src="pet.js"></script>
</body>
</html>
