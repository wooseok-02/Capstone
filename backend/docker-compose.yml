# 로컬 개발용 구성이다. 배포에는 별도의 비밀값 관리와 HTTPS를 사용한다.
# 폴더 이름(backend)이 다른 프로젝트와 겹치지 않도록 프로젝트 이름을 고정한다.
name: knowledge-pet

services:
  db:
    # pgvector는 검색 기능 구현 때 사용할 예정이다.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_pet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 볼륨이 처음 만들어질 때만 실행된다.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pet}:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/${POSTGRES_DB:-knowledge_pet}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
